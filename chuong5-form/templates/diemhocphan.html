<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm học phần</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="the">
        <h1>Tính điểm học phần</h1>
        <p class="mo-ta">Nhập ba điểm thành phần</p>

        <form action="/diemhocphan" method="post">
            <div class="nhom">
                <label for="a">Điểm chuyên cần</label>
                <input type="text" name="a" id="a" inputmode="decimal" required>
            </div>

            <div class="nhom">
                <label for="b">Điểm giữa kỳ</label>
                <input type="text" name="b" id="b" inputmode="decimal" required>
            </div>

            <div class="nhom">
                <label for="c">Điểm cuối kỳ</label>
                <input type="text" name="c" id="c" inputmode="decimal" required>
            </div>

            <button type="submit" class="nut">Tính</button>
        </form>

        {% if dtb is defined %}
        <div class="ket-qua">
            <p class="chi-so">{{ dtb }}</p>
            <p class="phan-loai">Xếp loại: {{ kq }}</p>
        </div>
        {% elif kq is defined %}
        <div class="ket-qua warning">
            <p class="phan-loai">{{ kq }}</p>
        </div>
        {% endif %}
    </div>
</body>

</html>

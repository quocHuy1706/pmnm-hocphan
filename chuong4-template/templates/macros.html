{% macro status_badge(available) %}<span class="badge text-bg-{{ 'success' if available else 'secondary' }}">{{ 'Sẵn sàng' if available else 'Đang mượn' }}</span>{% endmacro %}
{% macro book_card(book) %}<article class="card h-100 shadow-sm book-card"><div class="card-body d-flex flex-column"><div class="d-flex justify-content-between gap-2 mb-2"><span class="badge text-bg-light text-primary">{{ book.category }}</span>{{ status_badge(book.available) }}</div><h2 class="h5">{{ book.title }}</h2><p class="text-secondary mb-1">{{ book.author }}</p><p class="small text-secondary">Xuất bản {{ book.year }}</p><p class="small flex-grow-1">{{ book.description }}</p><a class="btn btn-outline-primary mt-2" href="{{ url_for('book_detail', book_id=book.id) }}">Xem chi tiết</a></div></article>{% endmacro %}

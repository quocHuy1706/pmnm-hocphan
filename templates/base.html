<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bảng điều khiển học phần{% endblock %} · PMMNM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">PMMNM · Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Mở menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav"><div class="navbar-nav ms-auto">
            <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Trang chủ</a>
            <a class="nav-link {% if request.endpoint in ['student_list', 'student_detail', 'search'] %}active{% endif %}" href="{{ url_for('student_list') }}">Chương 3 · Sinh viên</a>
            <a class="nav-link" href="{{ chapter4_url }}">Chương 4 · LibraryMS</a>
            <a class="nav-link" href="{{ chapter5_url }}">Chương 5 · Forms</a>
        </div></div>
    </div>
</nav>
<main class="container py-4 flex-grow-1">{% block content %}{% endblock %}</main>
<footer class="border-top bg-white py-3 mt-auto"><div class="container small text-secondary d-flex justify-content-between flex-wrap gap-2"><span>© {{ current_year }} · Bài tập học phần Phần mềm mã nguồn mở</span><span>Flask · Bootstrap 5</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% extends "base.html" %}
{% block title %}Liên hệ{% endblock %}
{% block content %}<div class="card border-0 shadow-sm"><div class="card-body"><h1 class="h3">Liên hệ</h1><p class="text-secondary">Liên hệ với chúng tôi qua email hoặc điền biểu mẫu dưới đây.</p><form><div class="mb-3"><label class="form-label" for="contact-name">Họ tên</label><input class="form-control" id="contact-name" name="contact_name" placeholder="Nguyễn Văn A"></div><div class="mb-3"><label class="form-label" for="contact-email">Email</label><input class="form-control" type="email" id="contact-email" name="contact_email" placeholder="email@example.com"></div><div class="mb-3"><label class="form-label" for="message">Nội dung</label><textarea class="form-control" id="message" name="message" rows="4"></textarea></div><button type="submit" class="btn btn-primary">Gửi liên hệ</button></form></div></div>{% endblock %}

{% extends "base.html" %}
{% block title %}Giới thiệu{% endblock %}
{% block content %}
<h1>Trang Giới thiệu</h1>
{% if name %}
<div class="card" style="max-width:480px;">
    <p style="font-size:1.1rem;">Xin chào, <strong>{{ name }}</strong>! 👋</p>
    <p style="color:var(--muted);">Cảm ơn bạn đã ghé thăm {{ site_name }}.</p>
</div>
{% else %}
<p>Đây là trang giới thiệu của {{ site_name }}.</p>
{% endif %}
{% endblock %}

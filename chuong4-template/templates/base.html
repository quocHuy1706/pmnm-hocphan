<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %} · {{ site_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg navbar-dark library-nav shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('home') }}">{{ site_name }}</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#libraryNav" aria-label="Mở menu"><span class="navbar-toggler-icon"></span></button><div id="libraryNav" class="collapse navbar-collapse"><div class="navbar-nav ms-auto"><a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Trang chủ</a><a class="nav-link {% if request.endpoint in ['book_list', 'book_detail'] %}active{% endif %}" href="{{ url_for('book_list') }}">Sách</a><a class="nav-link" href="{{ url_for('api_books') }}">API</a></div></div></div></nav>
<main class="container py-4 flex-grow-1">{% block content %}{% endblock %}</main>
<footer class="border-top bg-white py-3 mt-auto"><div class="container small text-secondary d-flex justify-content-between flex-wrap gap-2"><span>© {{ current_year }} {{ site_name }}</span><span>LibraryMS v0.2</span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="the">
        <h1>Tính chỉ số BMI</h1>
        <p class="mo-ta">Nhập chiều cao và cân nặng của bạn</p>

        <form action="/bmi" method="post">
            <div class="nhom">
                <label for="chieucao">Chiều cao (cm)</label>
                <input type="text" name="chieucao" id="chieucao" inputmode="decimal"
                    placeholder="Ví dụ: 170" value="{{ chieucao or '' }}"
                    class="{% if loi_cao %}loi{% endif %}" required>
                {% if loi_cao %}<div class="loi-text">{{ loi_cao }}</div>{% endif %}
            </div>

            <div class="nhom">
                <label for="cannang">Cân nặng (kg)</label>
                <input type="text" name="cannang" id="cannang" inputmode="decimal"
                    placeholder="Ví dụ: 65,5" value="{{ cannang or '' }}"
                    class="{% if loi_nang %}loi{% endif %}" required>
                {% if loi_nang %}<div class="loi-text">{{ loi_nang }}</div>{% endif %}
            </div>

            <button type="submit" class="nut">Tính BMI</button>
        </form>

        {% if bmi is defined %}
        <div class="ket-qua {{ mau }}">
            <p class="chi-so">{{ bmi }}</p>
            <p class="phan-loai">{{ phanloai }}</p>
            <p class="can-nang">Cân nặng nên có: {{ can_min }} – {{ can_max }} kg
                (ứng với BMI 18,5 – 22,9)</p>
        </div>
        {% endif %}
    </div>
</body>

</html>

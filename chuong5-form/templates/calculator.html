<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính đơn giản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="the">
        <h1>Máy tính đơn giản</h1>
        <p class="mo-ta">Chọn phép tính và nhập hai số</p>

        <form action="/calculator" method="post">
            <div class="nhom">
                <label for="a">Số thứ nhất</label>
                <input type="text" name="a" id="a" inputmode="decimal" required>
            </div>

            <div class="nhom">
                <label for="operation">Phép tính</label>
                <select name="operation" id="operation">
                    <option value="cong">Cộng</option>
                    <option value="tru">Trừ</option>
                    <option value="nhan">Nhân</option>
                    <option value="chia">Chia</option>
                </select>
            </div>

            <div class="nhom">
                <label for="b">Số thứ hai</label>
                <input type="text" name="b" id="b" inputmode="decimal" required>
            </div>

            <button type="submit" class="nut">Tính</button>
        </form>

        {% if ketqua is not none %}
        <div class="ket-qua">
            <p class="chi-so">{{ ketqua }}</p>
        </div>
        {% endif %}
    </div>
</body>

</html>
